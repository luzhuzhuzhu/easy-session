<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Demo · EasySession</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <style>
      /* ============ 设计令牌 ============ */
      :root {
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        --t-fast: 120ms;
        --t-base: 200ms;
        --t-slow: 360ms;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="dark"] {
        --bg: #0d0d0d;
        --bg-elev: #1f1f1f;
        --bg-elev-2: #2a2a2a;
        --bg-hover: #2d2d2d;
        --border: #3a3a3a;
        --text: #ececec;
        --text-2: #b4b4b4;
        --text-3: #8e8e8e;
        --accent: #10a37f;
        --accent-hover: #1a7f64;
        --user-bubble: #2a2a2a;
        --assistant-bubble: transparent;
        --code-bg: #0d0d0d;
        --scrollbar: #3a3a3a;
      }

      [data-theme="light"] {
        --bg: #ffffff;
        --bg-elev: #f7f7f8;
        --bg-elev-2: #ececec;
        --bg-hover: #e8e8e8;
        --border: #d9d9d9;
        --text: #1a1a1a;
        --text-2: #5a5a5a;
        --text-3: #8a8a8a;
        --accent: #10a37f;
        --accent-hover: #0d8a6a;
        --user-bubble: #f4f4f4;
        --assistant-bubble: transparent;
        --code-bg: #f6f6f6;
        --scrollbar: #c8c8c8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        transition:
          background var(--t-base) var(--ease),
          color var(--t-base) var(--ease);
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-3);
      }

      /* ============ 布局 ============ */
      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }

      .app.sidebar-collapsed {
        grid-template-columns: 0 1fr;
      }
      .app.sidebar-collapsed .sidebar {
        transform: translateX(-100%);
        pointer-events: none;
      }

      /* ============ 侧栏 ============ */
      .sidebar {
        background: var(--bg-elev);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transition: transform var(--t-slow) var(--ease);
        overflow: hidden;
      }

      .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 4px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: var(--radius-sm);
        background: linear-gradient(135deg, var(--accent), #5eead4);
        display: grid;
        place-items: center;
        color: white;
        font-size: 13px;
        font-weight: 700;
      }

      .btn-new {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--bg-elev-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        transition: all var(--t-fast) var(--ease);
      }
      .btn-new:hover {
        background: var(--bg-hover);
        border-color: var(--text-3);
      }
      .btn-new svg {
        width: 16px;
        height: 16px;
      }

      .history {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .history-section {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        padding: 12px 10px 6px;
      }

      .history-item {
        padding: 9px 12px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all var(--t-fast) var(--ease);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-item:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .history-item.active {
        background: var(--bg-elev-2);
        color: var(--text);
      }
      .history-item svg {
        flex-shrink: 0;
        width: 14px;
        height: 14px;
        opacity: 0.7;
      }

      .sidebar-footer {
        padding: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background var(--t-fast) var(--ease);
      }
      .user-chip:hover {
        background: var(--bg-hover);
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        display: grid;
        place-items: center;
        color: white;
        font-size: 12px;
        font-weight: 600;
      }
      .user-name {
        font-size: 13px;
        font-weight: 500;
      }
      .user-plan {
        font-size: 11px;
        color: var(--text-3);
      }

      /* ============ 主区 ============ */
      .main {
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
        background: var(--bg);
      }

      .topbar {
        height: 56px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 8px;
        flex-shrink: 0;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
        border: none;
        background: transparent;
        color: var(--text-2);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: all var(--t-fast) var(--ease);
      }
      .icon-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
      }

      .model-pill {
        margin: 0 auto;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all var(--t-fast) var(--ease);
      }
      .model-pill:hover {
        background: var(--bg-hover);
      }
      .model-pill .dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
      }

      /* ============ 聊天区 ============ */
      .messages {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      .welcome {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 32px;
        animation: fadeUp 0.6s var(--ease);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .welcome h1 {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--accent), #5eead4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .welcome p {
        color: var(--text-2);
        font-size: 14px;
      }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        max-width: 760px;
        width: 100%;
      }

      .suggestion {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--bg-elev);
        cursor: pointer;
        text-align: left;
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.5;
        transition: all var(--t-fast) var(--ease);
      }
      .suggestion:hover {
        background: var(--bg-hover);
        border-color: var(--text-3);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .suggestion strong {
        display: block;
        color: var(--text);
        margin-bottom: 4px;
        font-size: 13px;
      }

      /* ============ 消息气泡 ============ */
      .message {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .message:last-child {
        border-bottom: none;
      }

      .message-inner {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      .avatar-lg {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 600;
        color: white;
      }
      .avatar-lg.user {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      }
      .avatar-lg.assistant {
        background: linear-gradient(135deg, var(--accent), #5eead4);
      }

      .bubble {
        flex: 1;
        min-width: 0;
        padding-top: 4px;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .bubble .name {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 4px;
        color: var(--text);
      }

      .bubble .content {
        font-size: 15px;
        color: var(--text);
        line-height: 1.7;
      }

      .bubble .content > *:first-child {
        margin-top: 0;
      }
      .bubble .content > *:last-child {
        margin-bottom: 0;
      }
      .bubble .content p {
        margin: 8px 0;
      }
      .bubble .content h1,
      .bubble .content h2,
      .bubble .content h3 {
        margin: 16px 0 8px;
        font-weight: 600;
        line-height: 1.3;
      }
      .bubble .content h1 {
        font-size: 22px;
      }
      .bubble .content h2 {
        font-size: 19px;
      }
      .bubble .content h3 {
        font-size: 17px;
      }
      .bubble .content ul,
      .bubble .content ol {
        margin: 8px 0;
        padding-left: 24px;
      }
      .bubble .content li {
        margin: 4px 0;
      }
      .bubble .content a {
        color: var(--accent);
        text-decoration: underline;
      }
      .bubble .content blockquote {
        border-left: 3px solid var(--border);
        padding-left: 14px;
        margin: 10px 0;
        color: var(--text-2);
      }
      .bubble .content table {
        border-collapse: collapse;
        margin: 12px 0;
        width: 100%;
        font-size: 14px;
      }
      .bubble .content th,
      .bubble .content td {
        border: 1px solid var(--border);
        padding: 8px 12px;
        text-align: left;
      }
      .bubble .content th {
        background: var(--bg-elev);
        font-weight: 600;
      }

      .bubble pre {
        margin: 12px 0;
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--code-bg);
        border: 1px solid var(--border);
        position: relative;
      }
      .bubble pre .lang {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 11px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-family: ui-monospace, monospace;
      }
      .bubble pre code {
        display: block;
        padding: 14px 16px;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.55;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: transparent !important;
      }

      .bubble :not(pre) > code {
        background: var(--bg-elev-2);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.88em;
        color: #ec5f5f;
      }
      [data-theme="dark"] .bubble :not(pre) > code {
        color: #f78da7;
      }

      .copy-btn {
        position: absolute;
        top: 8px;
        right: 60px;
        background: var(--bg-elev-2);
        border: 1px solid var(--border);
        color: var(--text-2);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        opacity: 0;
        transition: opacity var(--t-fast) var(--ease);
      }
      .bubble pre:hover .copy-btn {
        opacity: 1;
      }
      .copy-btn:hover {
        background: var(--bg-hover);
      }

      /* ============ 打字光标 ============ */
      .cursor {
        display: inline-block;
        width: 8px;
        height: 16px;
        background: var(--text);
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ============ 输入区 ============ */
      .composer {
        flex-shrink: 0;
        padding: 16px 24px 24px;
        background: linear-gradient(
          to top,
          var(--bg) 70%,
          transparent
        );
      }

      .composer-inner {
        max-width: 760px;
        margin: 0 auto;
      }

      .input-wrap {
        position: relative;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        transition: all var(--t-fast) var(--ease);
      }
      .input-wrap:focus-within {
        border-color: var(--text-3);
        box-shadow: var(--shadow-md);
      }

      .input-wrap textarea {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        line-height: 1.5;
        resize: none;
        padding: 14px 100px 14px 16px;
        max-height: 200px;
        min-height: 24px;
      }

      .input-wrap textarea::placeholder {
        color: var(--text-3);
      }

      .input-tools {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .send-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: all var(--t-fast) var(--ease);
      }
      .send-btn:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: scale(1.05);
      }
      .send-btn:disabled {
        background: var(--bg-elev-2);
        color: var(--text-3);
        cursor: not-allowed;
      }
      .send-btn svg {
        width: 16px;
        height: 16px;
      }

      .hint {
        text-align: center;
        font-size: 11px;
        color: var(--text-3);
        margin-top: 8px;
      }

      /* ============ 思考指示器 ============ */
      .thinking {
        display: inline-flex;
        gap: 4px;
        padding: 4px 0;
      }
      .thinking span {
        width: 6px;
        height: 6px;
        background: var(--text-3);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
      }
      .thinking span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .thinking span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ============ 工具栏（消息下方） ============ */
      .msg-actions {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        opacity: 0;
        transition: opacity var(--t-fast) var(--ease);
      }
      .message:hover .msg-actions {
        opacity: 1;
      }
      .msg-action {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--t-fast) var(--ease);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .msg-action:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .msg-action svg {
        width: 12px;
        height: 12px;
      }

      /* ============ 移动端 ============ */
      @media (max-width: 768px) {
        .app {
          grid-template-columns: 0 1fr;
        }
        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: 260px;
          z-index: 10;
          transform: translateX(-100%);
          box-shadow: var(--shadow-lg);
        }
        .sidebar.mobile-open {
          transform: translateX(0);
        }
        .mobile-backdrop {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 9;
        }
        .mobile-backdrop.show {
          display: block;
        }
        .message-inner,
        .composer {
          padding-left: 16px;
          padding-right: 16px;
        }
        .welcome h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <!-- 侧栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-mark">E</div>
            <span>EasySession Demo</span>
          </div>
          <button class="btn-new" id="btnNew">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" stroke-linecap="round" />
            </svg>
            开启新对话
          </button>
        </div>

        <nav class="history" id="history">
          <div class="history-section">今天</div>
          <div class="history-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            当前对话
          </div>
          <div class="history-section">昨天</div>
          <div class="history-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            解释一下 QuickSort
          </div>
          <div class="history-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            写一首关于秋天的诗
          </div>
          <div class="history-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            Rust 生命周期怎么学
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="avatar">L</div>
            <div>
              <div class="user-name">Linglin</div>
              <div class="user-plan">Free Plan</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="mobile-backdrop" id="mobileBackdrop"></div>

      <!-- 主区 -->
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="btnToggle" title="侧栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" />
            </svg>
          </button>
          <button class="model-pill">
            <span class="dot"></span>
            GPT-4o Demo
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;">
              <path d="M6 9l6 6 6-6" stroke-linecap="round" />
            </svg>
          </button>

快速排序是一种 **分治算法**，平均时间复杂度 \`O(n log n)\`。

## 核心思路

1. 选一个基准值（pivot）
2. 把数组分成两部分：小于 pivot 的放左边，大于的放右边
3. 递归地对左右两部分排序

## Python 实现

\`\`\`python
def quicksort(arr):
    """原地快速排序"""
    if len(arr) <= 1:
        return arr
    pivot = arr[len(arr) // 2]
    left = [x for x in arr if x < pivot]
    mid = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]
    return quicksort(left) + mid + quicksort(right)


# 测试
print(quicksort([3, 6, 8, 10, 1, 2, 1, 9, 5]))
# => [1, 1, 2, 3, 5, 6, 8, 9, 10]
\`\`\`

## 复杂度分析

| 情况     | 时间复杂度   | 空间复杂度 |
| -------- | ------------ | ---------- |
| 最好     | \`O(n log n)\` | \`O(log n)\` |
| 平均     | \`O(n log n)\` | \`O(log n)\` |
| 最坏     | \`O(n²)\`     | \`O(n)\`    |

> ⚠️ 最坏情况发生在 pivot 总是选到最大或最小元素时，可以用"三数取中"或随机化避免。

二分查找要求数组 **已排序**，通过每次把搜索区间减半来定位目标。

## 核心代码

\`\`\`typescript
function binarySearch(nums: number[], target: number): number {
  let left = 0;
  let right = nums.length - 1;

  while (left <= right) {
    const mid = Math.floor((left + right) / 2);
    if (nums[mid] === target) return mid;
    if (nums[mid] < target) left = mid + 1;
    else right = mid - 1;
  }
  return -1;
}
\`\`\`

每次循环区间缩小一半，n → n/2 → n/4 → ... → 1，最多 \`log₂n\` 步。

Transformer 是 2017 年论文 *"Attention Is All You Need"* 提出的架构，是 **GPT**、**BERT**、**T5** 等模型的基础。

## 三大核心组件

### 1. 自注意力机制 (Self-Attention)

让序列中的每个位置都能"看到"其他所有位置：

\`\`\`
Attention(Q, K, V) = softmax(Q · Kᵀ / √d_k) · V
\`\`\`

> Q、K、V 都来自同一个输入，分别代表 Query / Key / Value。

### 2. 多头注意力 (Multi-Head)

把注意力分成多个"头"并行计算，最后拼接：

| 头数 | 维度 | 含义 |
| ---- | ---- | ---- |
| h=8  | 64   | 不同子空间关注不同语义关系 |
| h=16 | 64   | 谷歌原版 |

### 3. 位置编码 (Positional Encoding)

由于注意力是 **置换不变** 的，必须显式注入位置信息：

\`\`\`python
def positional_encoding(pos, d_model):
    pe = np.zeros(d_model)
    for i in range(0, d_model, 2):
        pe[i] = np.sin(pos / 10000 ** (2*i / d_model))
        pe[i+1] = np.cos(pos / 10000 ** (2*i / d_model))
    return pe
\`\`\`

## 整体架构

\`\`\`
输入 → 嵌入 + 位置编码
     → N × [多头自注意力 → 残差 + LayerNorm → FFN → 残差 + LayerNorm]
     → 输出
\`\`\`
