name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  test:
    name: Unit and Electron runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
      - run: npm run build
      - name: Streaming and workspace UI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --config=playwright.config.ts e2e/18-workspace-split-resize.spec.ts e2e/20-workspace-drag.spec.ts e2e/21-terminal-streaming.spec.ts
      - name: Streaming and workspace UI (Windows/macOS)
        if: runner.os != 'Linux'
        run: npx playwright test --config=playwright.config.ts e2e/18-workspace-split-resize.spec.ts e2e/20-workspace-drag.spec.ts e2e/21-terminal-streaming.spec.ts
  package-smoke:
    name: Packaged runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --dir
          - os: macos-15-intel
            args: --mac --x64 --dir
          - os: ubuntu-24.04
            args: --linux --x64 --dir
          - os: ubuntu-24.04-arm
            args: --linux --arm64 --dir
          - os: windows-latest
            args: --win --x64 --dir
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - run: npm run test:runtime:packaged
